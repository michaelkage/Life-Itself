name: Simulation core

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python regression suite
        run: python -m unittest discover -s tests -t .

  cpp-linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure

  cpp-windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S cpp -B build -A x64
      - name: Build
        run: cmake --build build --config Debug --parallel 2
      - name: Run C++ tests
        run: ctest --test-dir build -C Debug --output-on-failure
